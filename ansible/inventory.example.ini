# Terraform generates the real inventory.ini from the Tailscale hostname
# (see ../terraform/ansible.tf). This example shows the expected shape if you
# ever need to write it by hand. Use the tailnet hostname (MagicDNS) or the
# tailscale IP as ansible_host.
[dashtec]
dashtec-host ansible_user=root

[dashtec:vars]
ansible_python_interpreter=/usr/bin/python3
