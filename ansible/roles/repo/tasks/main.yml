---
- name: Clone or update the dashtec repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_version }}"
    update: true
    # Reset the working tree each run: config.json is committed with empty secret
    # fields, and the config role injects secrets into it in place. force ensures
    # every deploy starts from the clean committed state before re-injecting.
    force: true

# `force: true` resets tracked files but leaves gitignored ones alone, so env
# files from older releases survive indefinitely. They are not inert: the web
# Dockerfile copies apps/web/ wholesale, and `next build` loads apps/web/.env —
# a leftover CHAIN_NAME there once decided the network switcher's default, so a
# mainnet build shipped showing Sepolia. The same files also baked months-old
# secrets and a superseded rollup address into the image.
#
# Only the unsuffixed legacy names are removed. The per-network files
# (.env.<network>, .env.build.<network>) are regenerated by env:propagate later
# in the deploy, and the root .env is rendered by the config role.
- name: Remove legacy unsuffixed env files left by older releases
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    state: absent
  loop:
    - apps/web/.env
    - apps/web/.env.build
    - apps/web/.env.local
    - apps/web/.env.production
    - packages/database/.env
    - packages/indexer-ponder/.env
    - packages/indexer-custom/.env
    - packages/materializer/.env
