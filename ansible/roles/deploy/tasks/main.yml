---
- name: Propagate config into package .env files
  # Node-only script (no deps); run via an ephemeral container so the host needs
  # no Node toolchain. Generates apps/web/.env(.build) and packages/*/.env.
  # Runs here rather than in the `config` role because it has to read the
  # contract addresses the `aztec_node` role discovered from the running node.
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      -v {{ app_dir }}:/app -w /app
      node:20-alpine node scripts/env/propagate-all.js {{ item }}
  loop: "{{ dashtec_networks }}"
  changed_when: true

- name: Build images and start each network profile
  ansible.builtin.command:
    cmd: docker compose --profile {{ item }} up -d --build
    chdir: "{{ app_dir }}"
  loop: "{{ dashtec_networks }}"
  changed_when: true

# Apply Prisma migrations against each network's database. Runs a one-off using
# the indexer-ponder image (which includes prisma + the migrations dir) and that
# network's DATABASE_URL. `migrate deploy` is idempotent — only new migrations
# apply. Any materializer/indexer errors before this completes self-heal on retry.
- name: Apply database migrations for each network
  ansible.builtin.command:
    cmd: >-
      docker compose --profile {{ item }} run --rm --no-deps -T
      --entrypoint sh {{ 'indexer-ponder' if item == 'mainnet' else 'indexer-ponder-testnet' }}
      -c "pnpm --filter @dashtec/database db:deploy"
    chdir: "{{ app_dir }}"
  loop: "{{ dashtec_networks }}"
  changed_when: true
