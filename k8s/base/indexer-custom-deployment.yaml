apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-custom
  labels:
    app: indexer-custom
    component: indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer-custom
  template:
    metadata:
      labels:
        app: indexer-custom
        component: indexer
    spec:
      containers:
        - name: indexer-custom
          image: dashtec-indexer-custom:latest
          # Default command runs all collectors
          ports:
            - containerPort: 4000
              name: stats
            - containerPort: 4001
              name: val-list
            - containerPort: 4002
              name: integrity
            - containerPort: 4003
              name: migration
            - containerPort: 4004
              name: prov-list
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dashtec-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: dashtec-secrets
                  key: redis-url
                  optional: true
          envFrom:
            - configMapRef:
                name: dashtec-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: indexer-custom
  labels:
    app: indexer-custom
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: stats
    - port: 4001
      targetPort: 4001
      protocol: TCP
      name: val-list
    - port: 4002
      targetPort: 4002
      protocol: TCP
      name: integrity
    - port: 4003
      targetPort: 4003
      protocol: TCP
      name: migration
    - port: 4004
      targetPort: 4004
      protocol: TCP
      name: prov-list
  selector:
    app: indexer-custom
