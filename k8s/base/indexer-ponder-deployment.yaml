apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-ponder
  labels:
    app: indexer-ponder
    component: indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer-ponder
  template:
    metadata:
      labels:
        app: indexer-ponder
        component: indexer
    spec:
      containers:
      - name: indexer-ponder
        image: dashtec-indexer-ponder:latest
        ports:
        - containerPort: 42069
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dashtec-secrets
              key: database-url
        - name: DATABASE_SCHEMA
          value: "ponder_prod"
        envFrom:
        - configMapRef:
            name: dashtec-config
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 42069
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 42069
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: indexer-ponder
  labels:
    app: indexer-ponder
spec:
  type: ClusterIP
  ports:
  - port: 42069
    targetPort: 42069
    protocol: TCP
    name: http
  selector:
    app: indexer-ponder
