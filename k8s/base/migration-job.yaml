apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
        - name: migration
          image: dashtec-web:latest
          command: ["npm", "run", "db:deploy", "--workspace=@dashtec/database"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dashtec-secrets
                  key: database-url
          envFrom:
            - configMapRef:
                name: dashtec-config
      restartPolicy: OnFailure
  backoffLimit: 1
